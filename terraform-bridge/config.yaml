name: "Terraform Bridge"
description: "Bearer-authenticated JSON proxy of the HA Supervisor HTTP API for OpenTofu/Terraform management."
version: "0.2.0-0"
slug: "terraform-bridge"
init: false
arch:
  - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "manual"
host_network: true
hassio_api: true
hassio_role: manager
ports:
  8124/tcp: 8124
ports_description:
  8124/tcp: "Terraform Bridge JSON API (HTTP, Tailscale-filtered)"
map:
  - type: app_config
    read_only: false
    path: /app_config
options:
  bind_address: "auto"
  bind_allowed_subnets: []
schema:
  bind_address: "match(^auto$|^(([0-9]{1,3}\\.){3}[0-9]{1,3})$)?"
  bind_allowed_subnets:
    - "str?"
