name: "Marketplace Repo Proxy"
description: "Serves private GitHub add-on repositories to the HA store under hashed URLs (scaffold)"
version: "0.1.0-0"
stage: "experimental"
slug: "marketplace_repo_proxy"
init: false
arch:
  - amd64
image: "ghcr.io/akentner/homeassistant-addons/{arch}-marketplace_repo_proxy"
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: "Proxy endpoint (optional; internal access via the add-on hostname works without publishing)"
options:
  log_level: "info"
schema:
  log_level: "list(debug|info|warning|error)"
