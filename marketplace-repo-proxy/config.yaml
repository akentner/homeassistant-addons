name: "Marketplace Repo Proxy"
description: "Serves private GitHub add-on repositories to the HA store under hashed URLs (scaffold)"
version: "0.1.0-0"
stage: "experimental"
slug: "marketplace_repo_proxy"
init: false
arch:
  - amd64
image: "ghcr.io/akentner/homeassistant-addons/{arch}-marketplace_repo_proxy"
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: "Proxy endpoint (optional; internal access via the add-on hostname works without publishing)"
options:
  github_token: ""
  sync_interval: 15
  repositories: []
  register_local: true
  api_enabled: false
  log_level: "info"
schema:
  github_token: "password"
  sync_interval: "int(5,)"
  public_url: "url?"
  repositories:
    - repository: "match(^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})/(?!\\.\\.?$)[A-Za-z0-9._-]{1,100}$)"
      branch: "match(^[A-Za-z0-9._/-]{1,200}$)?"
  register_local: "bool"
  api_enabled: "bool"
  log_level: "list(debug|info|warning|error)"
