name: "HAOS Monitor"
description: "Diagnostic: logs kernel log and I/O stalls of remote HAOS hosts, publishes status via HTTP and MQTT"
version: "0.3.0-0"
slug: "haos_monitor"
init: false
arch:
  - amd64
image: "ghcr.io/akentner/homeassistant-addons/{arch}-haos-monitor"
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
map:
  - share:rw
options:
  hosts:
    - name: "ha-backup"
      host: "192.168.178.9"
      port: 22222
      ssh_private_key: ""
  interval: 10
  problem_age: 60
  problem_io_full10: 30
  problem_sda_inflight: 8
  problem_dstate: 1
  mqtt_host: "a0d7b954-emqx"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_clear_discovery: false
schema:
  hosts:
    - name: "str"
      host: "str"
      port: "int(1,65535)?"
      ssh_private_key: "password"
  interval: "int(1,3600)"
  problem_age: "int(1,86400)"
  problem_io_full10: "float(0,100)"
  problem_sda_inflight: "int(1,1000)"
  problem_dstate: "int(1,1000)"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str"
  mqtt_password: "password"
  mqtt_discovery_prefix: "str"
  mqtt_clear_discovery: "bool"
