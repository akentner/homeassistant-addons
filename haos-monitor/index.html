<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAOS Monitor</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --fg: #212121; --dim: #727272; --line: #e0e0e0; --ok: #2e7d32; --bad: #c62828; --warn-bg: #ffebee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --fg: #e1e1e1; --dim: #9b9b9b; --line: #333; --ok: #66bb6a; --bad: #ef5350; --warn-bg: #3a1c1c; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .top { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  h1 { font-size: 18px; margin: 0; }
  button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; max-width: 760px; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head h2 { font-size: 16px; margin: 0; }
  .badge { padding: 2px 10px; border-radius: 10px; color: #fff; font-weight: 600; }
  .badge.ok { background: var(--ok); } .badge.bad { background: var(--bad); }
  .dim { color: var(--dim); }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  tr.bad { background: var(--warn-bg); color: var(--bad); font-weight: 600; }
  .chips span { display: inline-block; margin: 0 6px 4px 0; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .chips .up { color: var(--ok); } .chips .down { color: var(--bad); border-color: var(--bad); }
  pre { margin: 6px 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  h3 { font-size: 13px; margin: 12px 0 2px; color: var(--dim); font-weight: 600; }
</style>
</head>
<body>
<div class="top"><h1>HAOS Monitor</h1><button id="reload" type="button">Reload</button></div>
<div id="hosts"></div>
<p class="dim" id="foot"></p>
<script>
// Relative URLs on purpose: Ingress serves this page below a token path
var ROWS = [
  ["age", "Sample age (s)", "r_age"], ["up", "Host booted"], ["load1", "Load (1 min)"],
  ["io_some10", "I/O some (10 s avg %)"], ["io_full10", "I/O full (10 s avg %)", "r_io"],
  ["mem_full10", "Memory full (10 s avg %)"], ["sda_inflight", "sda in-flight requests", "r_sda"],
  ["mmc_inflight", "mmc in-flight requests"], ["dstate", "Tasks in D-state", "r_dstate"],
  ["kmsg_errors", "Kernel errors (10 min)", "r_kmsg"]
];
var PORTS = [["ping", "ping"], ["p22222", "SSH 22222"], ["p1883", "MQTT 1883"], ["p8123", "HA 8123"], ["p4357", "Observer 4357"]];
var cards = {};

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function num(v) { return v < 0 ? "–" : String(v); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
// Boot time (local, sample time minus uptime) plus the relative uptime like "5d 1h ago"
function uptime(v, s) {
  if (v < 0) return "–";
  var t = Math.floor(v), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60);
  var d = Math.floor(h / 24);
  var rel = d > 0 ? d + "d " + (h % 24) + "h" : h > 0 ? h + "h " + m + "m" : m > 0 ? m + "m" : "<1m";
  var b = new Date(Date.now() - (v + Math.max(s.age, 0)) * 1000);
  return b.getFullYear() + "-" + pad(b.getMonth() + 1) + "-" + pad(b.getDate()) + " " +
    pad(b.getHours()) + ":" + pad(b.getMinutes()) + ":" + pad(b.getSeconds()) + " (" + rel + " ago)";
}
var FMT = {up: uptime};
function get(url) {
  return fetch(url, {cache: "no-store"}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function render(h, s, inc) {
  var c = cards[h.slug];
  if (!c) { c = cards[h.slug] = el("div", "card"); document.getElementById("hosts").appendChild(c); }
  c.textContent = "";
  var head = el("div", "head");
  head.appendChild(el("h2", "", h.name));
  head.appendChild(el("span", "dim", h.host));
  head.appendChild(el("span", "badge " + (s.problem ? "bad" : "ok"), s.problem ? "PROBLEM" : "OK"));
  if (s.problem) head.appendChild(el("span", "", s.reasons));
  c.appendChild(head);

  var t = el("table");
  ROWS.forEach(function (r) {
    var tr = el("tr", s[r[2]] ? "bad" : "");
    tr.appendChild(el("td", "", r[1]));
    tr.appendChild(el("td", "", (FMT[r[0]] || num)(s[r[0]], s)));
    t.appendChild(tr);
  });
  c.appendChild(t);

  var chips = el("div", "chips");
  PORTS.forEach(function (p) {
    chips.appendChild(el("span", s[p[0]] === 1 ? "up" : "down", p[1] + (s[p[0]] === 1 ? " ✓" : " ✗")));
  });
  c.appendChild(chips);

  if (s.dstate_tasks) { c.appendChild(el("h3", "", "Blocked tasks")); c.appendChild(el("pre", "", s.dstate_tasks)); }
  if (s.kmsg_last) { c.appendChild(el("h3", "", "Last kernel error")); c.appendChild(el("pre", "", s.kmsg_last)); }
  c.appendChild(el("h3", "", "Recent incidents"));
  c.appendChild(el("pre", "dim", inc.length ? inc.join("\n") : "none logged"));
}

var busy = false;
function tick() {
  if (busy) return;
  busy = true;
  document.getElementById("reload").disabled = true;
  get("api/hosts.json").then(function (hosts) {
    return Promise.all(hosts.map(function (h) {
      var q = "?host=" + encodeURIComponent(h.slug);
      return Promise.all([get("api/status.json" + q), get("api/incidents.json" + q)])
        .then(function (r) { render(h, r[0], r[1]); });
    }));
  }).then(function () {
    document.getElementById("foot").textContent = "Updated " + new Date().toLocaleTimeString();
  }).catch(function (e) {
    document.getElementById("foot").textContent = "Update failed: " + e.message;
  }).then(function () {
    busy = false;
    document.getElementById("reload").disabled = false;
  });
}
document.getElementById("reload").addEventListener("click", tick);
tick();
setInterval(tick, 10000);
</script>
</body>
</html>
