name: "IaC Runner"
description: "Bearer-authenticated OpenTofu/Terraform runner for homelab IaC against R2/S3/local state backends."
version: "0.1.0-0"
slug: "iac-runner"
init: false
arch:
  - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "manual"
host_network: true
homeassistant_api: true
services:
  - "mqtt:need"
ports:
  8125/tcp: 8125
ports_description:
  8125/tcp: "IaC Runner JSON API (HTTP, Tailscale-filtered)"
options:
  bind_address: "auto"
  bind_allowed_subnets: []
  state_backend: "r2"
  r2_bucket: ""
  s3_endpoint: ""
  s3_bucket: ""
  s3_region: ""
  repos: []
  max_parallel_jobs: 4
  apply_timeout_minutes: 60
  runs_retention_hours: 24
schema:
  bind_address: "match(^auto$|^(([0-9]{1,3}\\.){3}[0-9]{1,3})$)?"
  bind_allowed_subnets:
    - "str?"
  state_backend: "list(match(^(r2|s3|local)$))"
  r2_bucket: "str"
  s3_endpoint: "str"
  s3_bucket: "str"
  s3_region: "str"
  repos:
    - name: "match(^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$)"
      url: "match(^(git@|ssh://).+$)"
      branch: "str?"
      ref: "str?"
  max_parallel_jobs: "int(1,32)"
  apply_timeout_minutes: "int(5,1440)"
  runs_retention_hours: "int(1,720)"
