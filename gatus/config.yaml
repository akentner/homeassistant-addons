name: "Gatus"
description: "Automated status and uptime monitoring with a beautiful dashboard"
version: "5.36.0-2"
slug: "gatus"
init: false
arch:
  # - aarch64
  - amd64
  # - armhf
  # - armv7
  # - i386
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:check-network"
panel_title: "Gatus"
map:
  - type: addon_config
    read_only: false
    path: /addon_config

options:
  log_level: "info"
  storage_type: "memory"
  metrics: false
  timezone: "Europe/Berlin"

schema:
  log_level: "list(debug|info|warning|error)?"
  storage_type: "list(memory|sqlite)?"
  metrics: "bool?"
  timezone: "str?"
