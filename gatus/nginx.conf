worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;

    server {
        listen 8099;

        # HA Supervisor passes the ingress path prefix in this header
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable gzip so sub_filter can operate on uncompressed responses
            proxy_set_header Accept-Encoding "";

            # Inject a runtime patch into the HTML <head> that:
            # - patches fetch() and XMLHttpRequest.open() to prepend the HA ingress
            #   path to all root-relative URLs (handles API calls like /api/v1/...)
            # - uses MutationObserver to fix src/href on dynamically created DOM nodes
            #   (handles Vue-rendered <img src="/img/logo.svg"> and similar)
            # The ingress path is read from window.location.pathname so no server-side
            # token knowledge is required.
            # needs: u[0]=="/"&&u.indexOf(b)!==0 to skip already-prefixed URLs
            sub_filter '<head>' '<head><script>(function(){var m=location.pathname.match(/^(\/api\/hassio_ingress\/[^\/]+)/);if(!m)return;var b=m[1];function fix(u){return typeof u=="string"&&u[0]=="/"&&u.indexOf(b)!==0?b+u:u}var F=window.fetch,X=XMLHttpRequest.prototype.open;window.fetch=function(u,o){return F.apply(this,[fix(u),o])};XMLHttpRequest.prototype.open=function(t,u){arguments[1]=fix(u);return X.apply(this,arguments)};function fixNode(n){if(n.nodeType!=1)return;["src","href"].forEach(function(a){var v=n.getAttribute&&n.getAttribute(a);if(v)n.setAttribute(a,fix(v))});n.querySelectorAll&&[].forEach.call(n.querySelectorAll("[src],[href]"),function(c){["src","href"].forEach(function(a){var v=c.getAttribute(a);if(v)c.setAttribute(a,fix(v))})})}new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(fixNode)})}).observe(document.documentElement,{childList:true,subtree:true})})();</script>';

            # Fix root-relative src/href in static HTML attributes (initial asset load)
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter_once off;
        }
    }
}
