worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;

    server {
        listen 8099;

        # HA Supervisor passes the ingress path prefix in this header
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable gzip so sub_filter can operate on uncompressed responses
            proxy_set_header Accept-Encoding "";

            # Inject a runtime patch into the HTML <head> that:
            # - patches fetch() and XMLHttpRequest.open() to prepend the HA ingress
            #   path to all root-relative URLs (handles API calls like /api/v1/...)
            # - uses MutationObserver to fix src/href on dynamically created DOM nodes
            #   (handles Vue-rendered <img src="/img/logo.svg"> and similar)
            # The ingress path is read from window.location.pathname so no server-side
            # token knowledge is required.
            # Gatus uses Vue Router with createWebHistory("/") — the router reads
            # window.location.pathname and matches against route definitions like "/".
            # Under HA ingress the path is "/api/hassio_ingress/TOKEN/" which does not
            # match, so the router renders nothing. The injected script:
            #   1. Strips the ingress prefix from the current URL via replaceState so
            #      the router sees "/" and matches the Home route.
            #   2. Patches pushState/replaceState to re-add the prefix on navigation.
            #   3. Patches the popstate capture phase to strip the prefix on back/forward.
            #   4. Patches fetch/XHR to prepend the prefix to root-relative API calls.
            #   5. Uses MutationObserver to fix src/href on Vue-rendered DOM nodes.
            # fix() now also resolves relative URLs (e.g. "../api/v1/...") via new URL()
            # before checking the ingress prefix. This handles ResponseTimeChart's
            # fetch("../api/v1/...") when the page loaded directly at /endpoints/{key}
            # (i.e. after replaceState stripped the ingress prefix, so location.href
            # has no prefix and "../" would otherwise resolve to "/api/v1/..." without it).
            sub_filter '<head>' '<head><script>(function(){var m=location.pathname.match(/^(\/api\/hassio_ingress\/[^\/]+)/);if(!m)return;var b=m[1];function fix(u){if(typeof u!="string")return u;var p=u;if(u[0]!="/"&&!/^https?:/.test(u)){try{p=new URL(u,location.href).pathname}catch(e){}}return p[0]=="/"&&p.indexOf(b)!==0?b+p:u}var F=window.fetch,X=XMLHttpRequest.prototype.open;window.fetch=function(u,o){return F.apply(this,[fix(u),o])};XMLHttpRequest.prototype.open=function(t,u){arguments[1]=fix(u);return X.apply(this,arguments)};function fixNode(n){if(n.nodeType!=1)return;["src","href"].forEach(function(a){var v=n.getAttribute&&n.getAttribute(a);if(v)n.setAttribute(a,fix(v))});n.querySelectorAll&&[].forEach.call(n.querySelectorAll("[src],[href]"),function(c){["src","href"].forEach(function(a){var v=c.getAttribute(a);if(v)c.setAttribute(a,fix(v))})})}new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(fixNode)})}).observe(document.documentElement,{childList:true,subtree:true});var oP=history.pushState.bind(history),oR=history.replaceState.bind(history);history.pushState=function(s,t,u){return oP(s,t,u&&u[0]=="/"?fix(u):u)};history.replaceState=function(s,t,u){return oR(s,t,u&&u[0]=="/"?fix(u):u)};window.addEventListener("popstate",function(){var p=location.pathname;if(p.indexOf(b)===0)oR(history.state,"",p.substring(b.length)||"/")},true);oR(history.state,"",location.pathname.substring(b.length)||"/")})();</script>';

            # Fix root-relative src/href in static HTML attributes (initial asset load)
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter_once off;
        }
    }
}
