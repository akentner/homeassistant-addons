worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;

    server {
        listen 8099;

        # HA Supervisor passes the ingress path prefix in this header
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable gzip so sub_filter can operate on uncompressed responses
            proxy_set_header Accept-Encoding "";

            # Inject a runtime patch into the HTML <head> that:
            # - patches fetch() and XMLHttpRequest.open() to prepend the HA ingress
            #   path to all root-relative URLs (handles API calls like /api/v1/...)
            # - uses MutationObserver to fix src/href on dynamically created DOM nodes
            #   (handles Vue-rendered <img src="/img/logo.svg"> and similar)
            # The ingress path is read from window.location.pathname so no server-side
            # token knowledge is required.
            sub_filter '<head>' '<head><script>(function(){var m=location.pathname.match(/^(\/api\/hassio_ingress\/[^\/]+)/);if(!m)return;var b=m[1],F=window.fetch,X=XMLHttpRequest.prototype.open;window.fetch=function(u,o){if(typeof u=="string"&&u[0]=="/"&&u[1]!="/")u=b+u;return F.apply(this,arguments)};XMLHttpRequest.prototype.open=function(t,u){if(typeof u=="string"&&u[0]=="/"&&u[1]!="/")arguments[1]=b+u;return X.apply(this,arguments)};new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType!=1)return;["src","href"].forEach(function(a){var v=n.getAttribute&&n.getAttribute(a);if(v&&v[0]=="/"&&v[1]!="/")n.setAttribute(a,b+v)});n.querySelectorAll&&[].forEach.call(n.querySelectorAll("[src],[href]"),function(c){["src","href"].forEach(function(a){var v=c.getAttribute(a);if(v&&v[0]=="/"&&v[1]!="/")c.setAttribute(a,b+v)})})})})}).observe(document.documentElement,{childList:true,subtree:true})})();</script>';

            # Fix root-relative src/href in static HTML attributes (initial asset load)
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter_once off;
        }
    }
}
