worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;

    server {
        listen 8099;

        # HA Supervisor passes the ingress path prefix in this header
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable gzip so sub_filter can work on the response body
            proxy_set_header Accept-Encoding "";

            # Gatus uses root-relative paths (/js/app.js, /css/...).
            # Replace src="/ and href="/ in HTML responses with the ingress-prefixed path.
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter_once off;
        }
    }
}
