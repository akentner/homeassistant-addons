worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;

    server {
        listen 8099;

        # HA Supervisor passes the ingress path prefix in this header
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inject <base href> so the Vue SPA resolves assets via the ingress path
            sub_filter '<head>' '<head><base href="$ingress_path/">';
            sub_filter_once on;
        }
    }
}
