configuration:
  avahi_reflector:
    name: Avahi mDNS Reflector
    description: >-
      Legacy-unicast mDNS reflector (disabled by default to prevent a known
      reliability bug).
  avahi_hostname:
    name: Avahi Hostname
    description: >-
      Fixed Avahi mDNS hostname, independent of the container's transient
      hostname across restarts.
  avahi_use_ipv6:
    name: Avahi IPv6 Resolution
    description: >-
      Advertise the mDNS hostname over IPv6 too (disabled by default, since
      the IPv6 address can be unreachable for some clients).
  server_aliases:
    name: Server Aliases
    description: >-
      Hostnames the CUPS web UI accepts in the HTTP Host header
      (space/comma-separated; "*" accepts any host header).
  printers:
    name: Printers
    description: >-
      Printers to register with CUPS at startup. Each entry sets a queue
      name, device URI, whether it's enabled, and an optional location.
  log_level:
    name: Log Level
    description: >-
      Add-on log verbosity (debug, info, warning, error). Default is warning for quiet
      operation. cupsd's error log is always forwarded to this add-on's own log output;
      the access log is additionally forwarded only at the debug level.
  paperless_upload:
    name: Paperless-ngx Upload
    description: >-
      Adds a second, PDF-only print queue whose output is uploaded to a paperless-ngx
      instance. Disabled by default; when enabled, set url and token at minimum.
    enabled:
      name: Enable
      description: >-
        Register the cups-pdf queue and start the upload worker. Disabled by default --
        existing installs see zero change until this is turned on.
    queue_name:
      name: Queue Name
      description: >-
        Name of the PDF-only print queue clients will see (e.g. in the iOS/macOS Print
        sheet).
    location:
      name: Location
      description: >-
        Optional location/description metadata shown for the queue, mirroring printers[]'s
        own location field.
    url:
      name: paperless-ngx URL
      description: >-
        Base URL of the paperless-ngx instance (e.g. "http://paperless.example.com:8000").
    token:
      name: API Token
      description: >-
        paperless-ngx API token, sent as "Authorization: Token <token>". Never logged.
    timeout:
      name: Upload Timeout (seconds)
      description: >-
        Maximum time to wait for a single upload request to paperless-ngx.
    retry_count:
      name: Retry Count
      description: >-
        Number of upload attempts before a document is moved to failed/ and a WARNING is
        logged.
    retry_delay:
      name: Retry Delay (seconds)
      description: >-
        Fixed delay between retry attempts for a failed upload.
