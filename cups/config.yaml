name: "CUPS"
description: >-
  CUPS print server with AirPrint support. Ships with a permanent fix for common Avahi mDNS
  reliability issues — legacy-unicast reflector slot exhaustion, hostname-conflict rename, and
  IPv6 resolution ambiguity are all resolved by a generated avahi-daemon.conf.
version: "0.1.0-16"
slug: "cups"
init: false
arch:
  - amd64
image: "ghcr.io/akentner/homeassistant-addons/{arch}-cups"
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: true
ports:
  631/tcp: 631
  631/udp: 631
ports_description:
  631/tcp: "CUPS/IPP web UI and printing"
  631/udp: "CUPS/IPP broadcast"

options:
  avahi_reflector: false
  avahi_hostname: "cups"
  avahi_use_ipv6: false
  server_aliases: "*"
  admin_username: ""
  admin_password: ""
  printers: []
  log_level: "warning"
  paperless_upload:
    enabled: false
    queue_name: "PDF-to-DMS"
    location: ""
    url: ""
    token: ""
    timeout: 30
    retry_count: 5
    retry_delay: 60

schema:
  avahi_reflector: "bool?"
  avahi_hostname: "str?"
  avahi_use_ipv6: "bool?"
  server_aliases: "str?"
  admin_username: "str?"
  admin_password: "password?"
  printers:
    - name: str
      uri: str
      enabled: bool?
      location: str?
      driver: "list(generic|brlaser)?"
      driver_model: str?
  log_level: "list(debug|info|warning|error)?"
  paperless_upload:
    enabled: "bool?"
    queue_name: "str?"
    location: "str?"
    url: "str?"
    token: "password?"
    timeout: "int?"
    retry_count: "int?"
    retry_delay: "int?"
