name: "Network Tools"
description: >-
    Network diagnostics and host detection for Home Assistant. Provides ARP-based host detection
    via arping, plus nmap, dig, ping and traceroute for manual use.
version: "0.2.3-0"
slug: "network-tools"
image: "ghcr.io/akentner/homeassistant-addons/{arch}-network_tools"
init: false
arch:
    - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: true

options:
    arping_hosts:
        - label: "example-host"
          ip: "192.168.178.1"
          mac: "AA:BB:CC:DD:EE:FF"
          device_name: "My Router"
    interface: "eth0"
    interval: 30
    port: 18080
    log_level: "info"
    mqtt_enabled: false
    mqtt_host: "core-mosquitto"
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
    mqtt_discovery_prefix: "homeassistant"

schema:
    arping_hosts:
        - label: str
          ip: str
          mac: str?
          device_name: str?
    interface: str
    interval: int
    port: int
    log_level: list(debug|info|warning|error)
    mqtt_enabled: bool
    mqtt_host: str
    mqtt_port: int
    mqtt_username: str?
    mqtt_password: str?
    mqtt_discovery_prefix: str?
