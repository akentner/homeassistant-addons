# Minimal avahi-daemon.conf for network-tools.
#
# This add-on only ever uses avahi as an mDNS *browse* client (avahi-browse,
# invoked by mdns_scan.py for the mdns_monitors feature) -- it never needs to
# advertise its own address on the network.
#
# Root cause this prevents: this add-on runs `host_network: true`, so its
# avahi-daemon shares the exact same host IPv4/IPv6 addresses as every other
# host_network add-on on this host (e.g. `cups`). By default avahi publishes
# an address record (and its paired reverse-PTR record) for every local
# address it sees -- so this daemon and cups's daemon each publish a
# conflicting reverse-PTR for the SAME shared address under a DIFFERENT
# hostname, triggering a perpetual, mutual RFC 6762 probe-conflict rename
# loop on both sides (see
# .planning/debug/resolved/mdns-rename-loop-regression.md).
#
# `publish-addresses=no` stops that registration entirely. Verified directly
# against this image's avahi-daemon (0.9-rc4) via a foreground --debug run:
# with this set, zero "Registering new address record" lines are logged.
# NOTE: `disable-publishing=yes` looks like the more obvious option and is
# documented as disabling "all" publishing, but was empirically verified
# NOT to suppress address-record registration on this avahi build -- do not
# rely on it alone for this specific conflict.
[publish]
publish-addresses=no
