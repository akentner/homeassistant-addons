name: "Markdown Renderer"
description: "Renders Markdown directories as Docsify SPAs via Home Assistant Ingress with Mermaid diagram support."
version: "1.1.0-23"
slug: "markdown-renderer"
init: false
arch:
  - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:text-box-multiple"
panel_title: "Markdown"
map:
  - share:rw
  - config:rw
  - media:rw
options:
  directories:
    - name: "docs"
      path: "/share/docs"
      git_pull: false
      git_pull_interval: 0
      git_url: ""
  kroki_url: "https://kroki.io"
  debug: false
schema:
  directories:
    - name: str
      path: str
      # Optional git sync — pulls remote at startup before nginx starts (GIT-01).
      # Default false; git binary is not invoked when unset (GIT-03).
      git_pull: bool
      # Optional periodic git pull interval in seconds. 0 = disabled (GIT-04).
      # When > 0, run.sh spawns one background loop that pulls each namespace
      # whose own interval has elapsed.
      git_pull_interval: int
      # Optional HTTPS URL for first-time clone. Used only when the path is
      # not yet a git repo and git_pull or git_pull_interval is set. SSH auth
      # is out of scope (v1.2).
      git_url: str?
      # Per-namespace custom CSS. ``css`` is inlined into a <style> tag in
      # the generated index.html; ``css_url`` is loaded via <link>. Both
      # options stack - the inlined CSS overrides the linked stylesheet
      # (later in document order wins). Both fields are optional
      # (``str?``) so existing user options that pre-date these fields
      # keep working without re-saving them in the HA UI.
      css: str?
      css_url: str?
      # Per-namespace Docsify plugins. NOT declared in the HA schema
      # on purpose - HA's Schema parser rejects optional lists-of-dicts
      # with mixed optional/required fields, so adding the field at the
      # schema level would break startup for users with pre-existing
      # options.json that lacks the ``plugins`` key. The list is
      # accepted by ``generate_nginx.py`` at runtime and fully validated
      # (type checks, https-only URLs, code XOR url, 100KB warn / 500KB
      # hard size limit, JS-syntax heuristic) in Python. See DOCS.md
      # ``Plugins`` section for the accepted shape.
  kroki_url: str
  debug: bool
