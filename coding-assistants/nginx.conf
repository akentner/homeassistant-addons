worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        server_name _;

        root /opt/coding-assistants;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        # ttyd web terminal — base-path must match
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # opencode serve — rewrites /opencode/* → /*
        # Injects a script into HTML that monkey-patches fetch/XHR/EventSource/WebSocket
        # so all root-relative API calls (/global/config, /provider, etc.) are prefixed
        # with /opencode/ — handles every endpoint without enumeration.
        location /opencode/ {
            proxy_pass http://127.0.0.1:4096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            sub_filter_once off;
            # Rewrite absolute asset/favicon HTML attributes
            sub_filter '="/assets/'  '="./assets/';
            sub_filter "='/assets/"  "='./assets/";
            sub_filter '="/favicon'  '="./favicon';
            # Inject path-prefix patcher before </head> — runs before app bundle
            # b = current pathname without trailing slash = full HA ingress prefix + /opencode
            # e.g. /app/72a005f5_coding_assistants/opencode
            sub_filter '</head>' '<script>(function(){var b=window.location.pathname.replace(/\/+$/,""),r=function(u){return typeof u==="string"&&u[0]==="/"&&u.indexOf(b)!==0?b+u:u};var f=window.fetch;window.fetch=function(u,o){return f.call(this,r(u),o)};var x=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(){arguments[1]=r(arguments[1]);return x.apply(this,arguments)};var E=window.EventSource;if(E)window.EventSource=function(u,o){return new E(r(u),o)};var W=window.WebSocket;if(W)window.WebSocket=function(u,p){if(typeof u==="string"&&u[0]==="/")u=(location.protocol==="https:"?"wss":"ws")+"://"+location.host+r(u);return p?new W(u,p):new W(u)}})();</script></head>';
        }
    }
}
