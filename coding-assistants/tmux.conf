# Prefix: Ctrl-a (screen-style)
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# Sensible defaults
set-option -g history-limit 20000
set-option -g mouse on
set-option -g default-terminal "xterm-256color"
set-option -g escape-time 10
set-option -g focus-events on
set -s set-clipboard on

# Start indices at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g default-command "fish"

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Mouse wheel in copy mode
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Split panes with | and - (prefix-based, kept as fallback)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Windows Terminal-style splits (no prefix; DE keyboard: + is unshifted)
bind -n M-+     split-window -h -c "#{pane_current_path}"
bind -n M--     split-window -v -c "#{pane_current_path}"

# Pane resize with Shift+Alt+Arrow (no prefix)
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Reload config
bind r source-file /etc/tmux.conf \; display "tmux.conf reloaded"

# Status bar
set-option -g status on
set-option -g status-interval 5
set-option -g status-position bottom
set-option -g status-style bg=colour234,fg=colour137
set-option -g status-left "#[fg=colour233,bg=colour241,bold] #S "
set-option -g status-right "#[fg=colour233,bg=colour241,bold] %H:%M "
set-option -g status-right-length 20
set-option -g status-left-length 20

set-window-option -g window-status-current-style fg=colour81,bg=colour238,bold
set-window-option -g window-status-current-format " #I:#W#F "
set-window-option -g window-status-style fg=colour138,bg=colour235
set-window-option -g window-status-format " #I:#W#F "

# Pane borders
set-option -g pane-border-style fg=colour238
set-option -g pane-active-border-style fg=colour208
