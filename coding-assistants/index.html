<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Assistants</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #181825;
      padding: 6px 14px;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
      user-select: none;
    }

    #topbar .logo {
      color: #89b4fa;
      font-weight: bold;
      margin-right: 10px;
      letter-spacing: 0.03em;
    }

    .tab-btn {
      padding: 4px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: #6c7086;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .tab-btn:hover {
      background: #313244;
      color: #cdd6f4;
    }
    .tab-btn.active {
      background: #313244;
      color: #89b4fa;
      border-color: #45475a;
    }

    #frames {
      flex: 1;
      position: relative;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    iframe.hidden { display: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="logo">Coding Assistants</span>
    <button class="tab-btn active" onclick="show('terminal', this)">Terminal</button>
  </div>
  <div id="frames">
    <iframe id="frameTerminal" src="./terminal/"></iframe>
  </div>

  <script>
    const iframes = { terminal: 'frameTerminal' };
    const loaded  = { terminal: true };

    function show(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('iframe').forEach(f => f.classList.add('hidden'));
      const frame = document.getElementById(iframes[name]);
      frame.classList.remove('hidden');
      if (!loaded[name]) {
        frame.src = frame.dataset.src;
        loaded[name] = true;
      }
    }
  </script>
</body>
</html>
