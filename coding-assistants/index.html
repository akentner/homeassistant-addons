<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Assistants</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #181825;
      padding: 6px 14px;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
      user-select: none;
    }

    #topbar .logo {
      color: #89b4fa;
      font-weight: bold;
      margin-right: 10px;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .tab-btn {
      padding: 4px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: #6c7086;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .tab-btn:hover {
      background: #313244;
      color: #cdd6f4;
    }
    .tab-btn.active {
      background: #313244;
      color: #89b4fa;
      border-color: #45475a;
    }

    /* Link-style tab — opens in new window, no active state */
    .tab-link {
      padding: 4px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: #6c7086;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tab-link:hover {
      background: #313244;
      color: #cdd6f4;
    }
    .tab-link svg {
      opacity: 0.5;
      flex-shrink: 0;
    }
    .tab-link:hover svg { opacity: 0.8; }

    .spacer { flex: 1; }

    #versions {
      display: flex;
      gap: 14px;
      color: #45475a;
      font-size: 11px;
      white-space: nowrap;
    }
    #versions span { color: #585b70; }
    #versions span b { color: #6c7086; font-weight: normal; }

    #frames {
      flex: 1;
      position: relative;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    iframe.hidden { display: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="logo">Coding Assistants</span>
    <button class="tab-btn active" onclick="show('terminal', this)">Terminal</button>
    <a  id="opencode-link" class="tab-link" target="_blank" title="Opens in new tab (port 4096)">
      OpenCode
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
        <path d="M1.5 1h4V2H2.5v5.5H8V6h1v2.5a.5.5 0 0 1-.5.5h-6a.5.5 0 0 1-.5-.5v-7A.5.5 0 0 1 1.5 1z"/>
        <path d="M5.5 1H9v3.5L7.5 3 5 5.5 4.5 5 7 2.5z"/>
      </svg>
    </a>
    <button class="tab-btn" onclick="show('info', this)">Info</button>
    <div class="spacer"></div>
    <div id="versions">
      <span>addon <b id="v-addon">…</b></span>
      <span>claude <b id="v-claude">…</b></span>
      <span>opencode <b id="v-opencode">…</b></span>
    </div>
  </div>
  <div id="frames">
    <iframe id="frameTerminal" src="./terminal/"></iframe>
    <iframe id="frameInfo" class="hidden" data-src="./info.html"></iframe>
  </div>

  <script>
    // Set OpenCode link to port 4096 on same host
    document.getElementById('opencode-link').href =
      location.protocol + '//' + location.hostname + ':4096';

    const iframes = {
      terminal: 'frameTerminal',
      info:     'frameInfo',
    };
    const loaded = { terminal: true };

    function show(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('iframe').forEach(f => f.classList.add('hidden'));
      const frame = document.getElementById(iframes[name]);
      frame.classList.remove('hidden');
      if (!loaded[name]) {
        frame.src = frame.dataset.src;
        loaded[name] = true;
      }
    }

    fetch('./versions.json')
      .then(r => r.json())
      .then(v => {
        document.getElementById('v-addon').textContent    = v.addon    || '—';
        document.getElementById('v-claude').textContent   = v.claude   || '—';
        document.getElementById('v-opencode').textContent = v.opencode || '—';
      })
      .catch(() => {});
  </script>
</body>
</html>
