name: "Coding Assistants"
description: "Terminal with Claude Code, OpenCode, and GitHub Copilot CLI — SSH + web terminal"
version: "1.0.0-alpha26"
slug: "coding_assistants"
init: false
hassio_api: true
hassio_role: manager
arch:
  - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "manual"
host_network: false
ingress: true
ingress_port: 7681
ports:
  2222/tcp: 2222
ports_description:
  2222/tcp: "SSH server"
map:
  - homeassistant_config:rw
  - data:rw
  - share:rw
  - media:rw

backup_exclude:
  - ".config/opencode/cache/*"
  - ".local/share/opencode/cache/*"
  - ".npm/*"
  - ".cache/*"

options:
  log_level: "info"
  authorized_keys: []
  terminal_font_size: 16
  terminal_theme: "default"
  terminal_font_family: "JetBrainsMono Nerd Font Mono, monospace"
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  zigbee2mqtt:
    enabled: false
    mqtt_broker_url: "mqtt://homeassistant:1883"
    mqtt_username: ""
    mqtt_password: ""
    mqtt_base_topic: "zigbee2mqtt"
    db_path: "/data/zigbee2mqtt-mcp.db"
    log_level: "info"
  mcp_servers:
    - name: ha-mcp
      type: http
      url: http://81f33d0f-ha-mcp:9583/private_REPLACE_WITH_SECRET
    - name: fff
      type: stdio
      command: /usr/local/bin/fff-mcp
  env_vars: []
  bash_aliases: []

schema:
  log_level: list(debug|info|warning|error)
  authorized_keys:
    - str
  terminal_font_size: int
  terminal_theme: "list(default|solarized-dark|solarized-light|monokai|tomorrow-night|zenburn)"
  terminal_font_family: str
  ha_url: str
  ha_token: str
  zigbee2mqtt:
    enabled: bool?
    mqtt_broker_url: str?
    mqtt_username: str?
    mqtt_password: password?
    mqtt_base_topic: str?
    db_path: str?
    log_level: str?
  mcp_servers:
    - name: str
      type: list(stdio|http)
      command: str?
      url: str?
  env_vars:
    - name: str
      value: str
  bash_aliases:
    - name: str
      command: str
