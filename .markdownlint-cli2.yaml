config:
  extends: ./.markdownlint.json

globs:
  - "**/*.md"

ignores:
  - "node_modules/**"
  - ".git/**"
  - "**/.planning/**"
  - "**/.claude/**"
  - "**/.agents/**"
  - "**/.omo/**"
  # CHANGELOG.md is auto-generated from upstream GitHub release notes for the
  # add-ons that ship with a .upstream.yaml (currently litellm, meridian,
  # authentik). Upstream PR/commit references appear as bare URLs in those
  # notes (e.g. `https://github.com/BerriAI/litellm/pull/39938`) and trigger
  # MD034. Operators do not edit these by hand — they're regenerated by the
  # auto-update workflow — so suppressing the rule for the entire pattern is
  # safer than maintaining per-file exceptions. If a hand-written CHANGELOG
  # ever drifts out of compliance, the rest of the repo (README.md / DOCS.md)
  # still gets the full check.
  - "**/CHANGELOG.md"
  # .gsd/ is GSD (Get-Shit-Done) workflow state — generated plan/codebase
  # docs that scratch local planning artefacts. Like .planning/ and .claude/,
  # it's not source code or operator-facing docs; the markdownlint rules
  # don't apply. Adding the ignore so pre-commit doesn't fail on every
  # commit that touches repo state.
  - "**/.gsd/**"
