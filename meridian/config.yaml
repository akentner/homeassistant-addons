name: "Meridian Claude Max Proxy"
description: "Exposes a local Anthropic-compatible API on port 3456 backed by a Claude Max subscription"
version: "1.26.6-1"
slug: "meridian"
init: false
arch:
  # - aarch64
  - amd64
  # - armhf
  # - armv7
  # - i386
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: false
ports:
  3456/tcp: 3456
ports_description:
  3456/tcp: "Anthropic-compatible API endpoint"
map: []

options:
  log_level: "info"
  port: 3456

schema:
  log_level: list(debug|info|warning|error)
  port: int
