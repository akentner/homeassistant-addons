name: "Meridian Claude Max Proxy"
description: "Exposes a local Anthropic-compatible API on port 3456 backed by a Claude Max subscription"
version: "1.44.1-0"
slug: "meridian"
init: false
arch:
  # - aarch64
  - amd64
  # - armhf
  # - armv7
  # - i386
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: false
ingress: true
ingress_port: 8099
ports:
  3456/tcp: 3456
ports_description:
  3456/tcp: "Anthropic-compatible API endpoint"
map:
  - data:rw

options:
  log_level: "info"
  port: 3456
  passthrough: false
  max_concurrent: 10
  max_sessions: 1000
  max_stored_sessions: 10000
  workdir: "/data/meridian"
  idle_timeout_seconds: 120
  telemetry_size: 1000
  no_file_changes: false
  sonnet_model: "sonnet[1m]"
  default_agent: "opencode"

schema:
  log_level: list(debug|info|warning|error)
  port: int
  passthrough: bool
  max_concurrent: int
  max_sessions: int
  max_stored_sessions: int
  workdir: str
  idle_timeout_seconds: int
  telemetry_size: int
  no_file_changes: bool
  sonnet_model: "list(sonnet|sonnet[1m])"
  default_agent: "list(opencode|pi|crush|droid|passthrough)"
