repos:
  # YAML linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint

  # General code formatting and linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags used by Home Assistant
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091, -e, SC2034]  # Ignore sourcing and unused variables

  # Markdown formatting
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types: [markdown]

  # Markdown linting — mirrors the GH Action lint.yml so CHANGELOG.md and
  # other auto-generated files are caught locally before push. Prettier
  # handles formatting; markdownlint enforces structural rules like
  # MD034 (no-bare-urls) that prettier does not.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions workflow linting (disabled - repository not available)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.3
    hooks:
      - id: actionlint

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        args:
          - --ignore
          - DL3008  # apt packages are not version-pinned in HA add-on Dockerfiles
          - --ignore
          - DL3018  # apk packages are not version-pinned in HA add-on Dockerfiles
          - --ignore
          - DL3059  # Multiple consecutive RUN instructions are intentional for clarity
          - --ignore
          - DL4006  # pipefail not applicable with alpine/busybox sh
          - --ignore
          - DL3016  # npm install -g without version pin — required for @anthropic-ai/claude-code

  # JSON formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent=2]

  # Custom validation hooks
  - repo: local
    hooks:
      - id: validate-dockerfile-args
        name: Validate Dockerfile ARG-before-FROM scope
        entry: ./internal/validate-dockerfile-args.sh
        language: script
        files: ^(phone-logger|meridian)/Dockerfile$
        pass_filenames: true
      - id: validate-versions
        name: Validate Add-on Versioning
        entry: ./internal/validate-versions.sh
        language: script
        always_run: true
        pass_filenames: false
      - id: validate-addon-config
        name: Validate Add-on config.yaml Schema
        entry: python3 internal/validate-addon-config.py
        language: system
        always_run: true
        pass_filenames: false

# Configuration
default_language_version:
  python: python3  # Use system default Python 3.x

# Global settings
fail_fast: false
minimum_pre_commit_version: "4.6.2"
