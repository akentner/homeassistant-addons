repos:
  # YAML linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint

  # General code formatting and linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags used by Home Assistant
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091, -e, SC2034]  # Ignore sourcing and unused variables

  # Markdown formatting
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types: [markdown]

  # Markdown linting — mirrors the GH Action lint.yml so CHANGELOG.md and
  # other auto-generated files are caught locally before push. Prettier
  # handles formatting; markdownlint enforces structural rules like
  # MD034 (no-bare-urls) that prettier does not.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions workflow linting (disabled - repository not available)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.3
    hooks:
      - id: actionlint

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        args:
          - --ignore
          - DL3008  # apt packages are not version-pinned in HA add-on Dockerfiles
          - --ignore
          - DL3018  # apk packages are not version-pinned in HA add-on Dockerfiles
          - --ignore
          - DL3059  # Multiple consecutive RUN instructions are intentional for clarity
          - --ignore
          - DL4006  # pipefail not applicable with alpine/busybox sh
          - --ignore
          - DL3016  # npm install -g without version pin — required for @anthropic-ai/claude-code

  # JSON formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent=2]

  # Security scanning
  #
  # gitleaks scans the STAGED DIFF (`--staged`), not the working tree, so it costs nothing on a
  # commit that touches no secrets, and `--redact` keeps any hit out of the terminal log and out of
  # the CI job log. The upstream hook definition already supplies the entry and `pass_filenames` —
  # do not restate or override them here. Consequence: this hook is a deliberate no-op in CI,
  # because `lint.yml` runs `pre-commit run --all-files` with nothing staged; history coverage came
  # from a one-time baseline scan instead. Allowlists live in `.gitleaks.toml` — see
  # `docs/DEVELOPMENT.md`, section `## Security Scanning`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # zizmor audits workflow and composite-action YAML for security issues actionlint does not look
  # for at all: untrusted `${{ }}` interpolation into `run:` blocks, over-broad `permissions:`, and
  # mutable action refs. It is a `repo: local` hook because upstream publishes no
  # `.pre-commit-hooks.yaml`, not by preference. `--offline` is mandatory, not cosmetic: zizmor runs
  # online audits whenever GH_TOKEN / GITHUB_TOKEN / ZIZMOR_GITHUB_TOKEN is set, and this hook is
  # reached by `make check-all` -> `lint`, whose members must all be offline and deterministic
  # (see the policy comment in the Makefile above `verify-images`). Pre-existing findings are
  # deferred per-finding in `zizmor.yml`; the hook stays red for any NEW one.
  - repo: local
    hooks:
      - id: zizmor
        name: Audit GitHub Actions workflows (zizmor)
        description: Static security audit of workflow and composite-action YAML
        entry: zizmor --offline
        language: python
        additional_dependencies: ["zizmor==1.30.1"]
        files: ^\.github/(workflows/.+\.ya?ml|actions/.+/action\.ya?ml)$

  # Custom validation hooks
  - repo: local
    hooks:
      - id: validate-dockerfile-args
        name: Validate Dockerfile ARG-before-FROM scope
        entry: ./internal/validate-dockerfile-args.sh
        language: script
        files: ^(phone-logger|meridian|iac-runner)/Dockerfile$
        pass_filenames: true
      - id: validate-versions
        name: Validate Add-on Versioning
        entry: ./internal/validate-versions.sh
        language: script
        always_run: true
        pass_filenames: false
      - id: validate-addon-config
        name: Validate Add-on config.yaml Schema
        entry: python3 internal/validate-addon-config.py
        language: system
        always_run: true
        pass_filenames: false
      # verify-opencode-gate proves the truth table of the job-level `if:` in `.github/workflows/opencode.yml` over
      # 72 fixture rows. That `if:` is the ONLY control between a drive-by commenter on this PUBLIC repository and an
      # `opencode` job whose environment holds an API key, so a future edit widening the author clause used to be able
      # to land unnoticed. Now it goes red at commit time.
      #
      # Scoped with `files:` rather than `always_run: true`, on purpose. The verifier reads exactly ONE file, so that
      # file changing IS the complete trigger set: every edit that widens the gate necessarily touches
      # `opencode.yml`, so the narrow scope still fails closed for the threat. The verifier itself is in the regex so
      # that an edit to the guard re-proves it against the live workflow. Deliberate consequence: DELETING the
      # workflow does not fire the hook, because pre-commit passes no deleted paths — that is correct, since a deleted
      # workflow cannot be triggered at all and there is nothing left to guard, whereas `always_run: true` would make
      # the removal unshippable (the verifier exits 2 when the workflow is unreadable) and turn a legitimate deletion
      # into a permanent red. Cost was NOT the reason — the run takes 0.08 s. The sibling `always_run` hooks
      # (`validate-versions`, `validate-addon-config`) are always-run because they scan the whole repository for
      # cross-file invariants; this one does not. CI coverage is unaffected: `make check-all` -> `lint` and
      # `.github/workflows/lint.yml` both run `pre-commit run --all-files`, which passes every file, so the regex
      # matches and the hook runs there too.
      #
      # `pass_filenames: false` is load bearing, not stylistic: the script's CLI is `--workflow` / `--job` / `--quiet`
      # with NO positional argument, so a passed path would be an argparse error instead of a check.
      - id: verify-opencode-gate
        name: Verify opencode.yml comment-trigger author gate
        description: Prove the job-level author_association denial in opencode.yml over 72 fixture rows
        entry: python3 internal/verify-opencode-gate.py --quiet
        language: system
        files: ^(\.github/workflows/opencode\.yml|internal/verify-opencode-gate\.py)$
        pass_filenames: false
      - id: verify-bridge-scaffold
        name: terraform-bridge scaffold verify
        description: Build the Bridge, assert <= 30 MiB image, JSON placeholder, SIGTERM drain, SIGHUP reopen
        entry: bash internal/verify-bridge-scaffold.sh
        language: system
        pass_filenames: false
        files: ^terraform-bridge/.*$
        require_serial: true
      - id: verify-bridge-no-token-leak
        name: terraform-bridge no-token-leak
        description: "Assert AUTH-05 + CF-02 + OPS-01 invariants: no SUPERVISOR_TOKEN/Bearer/bridge_token substrings in stdout, bridge plaintext surfaces exactly once, actor_token_fp matches SHA-256[8], OPS-01 request-log emitted for GET /"
        entry: bash internal/verify-bridge-no-token-leak.sh
        language: system
        pass_filenames: false
        files: ^terraform-bridge/.*$
        require_serial: true

# Configuration
default_language_version:
  python: python3  # Use system default Python 3.x

# Global settings
fail_fast: false
minimum_pre_commit_version: "4.6.2"
