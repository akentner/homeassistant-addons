repos:
  # YAML linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint

  # General code formatting and linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags used by Home Assistant
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091, -e, SC2034]  # Ignore sourcing and unused variables

  # Markdown formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [markdown]

  # GitHub Actions workflow linting (disabled - repository not available)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.3
    hooks:
      - id: actionlint

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        args:
          - --ignore
          - DL3006  # ARG before FROM is the HA base-image pattern
          - --ignore
          - DL3018  # apk packages are not version-pinned in HA add-on Dockerfiles
          - --ignore
          - DL3059  # Multiple consecutive RUN instructions are intentional for clarity
          - --ignore
          - DL4006  # pipefail not applicable with alpine/busybox sh
          - --ignore
          - DL3016  # npm install -g without version pin — required for @anthropic-ai/claude-code

  # JSON formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent=2]

  # Custom validation hooks
  - repo: local
    hooks:
      - id: validate-versions
        name: Validate Add-on Versioning
        entry: ./scripts/validate-versions.sh
        language: script
        files: ^(fritz-callmonitor2mqtt|phone-logger|meridian)/(config\.yaml|build\.yaml|README\.md)$
        pass_filenames: false
      - id: validate-addon-config
        name: Validate Add-on config.yaml Schema
        entry: python3 scripts/validate-addon-config.py
        language: system
        files: ^(fritz-callmonitor2mqtt|phone-logger|meridian)/config\.yaml$
        pass_filenames: false

# Configuration
default_language_version:
  python: python3  # Use system default Python 3.x

# Global settings
fail_fast: false
minimum_pre_commit_version: "3.0.0"
