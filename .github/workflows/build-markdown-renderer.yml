name: Build Markdown Renderer

on:
  push:
    branches:
      - main
    paths:
      - "markdown-renderer/**"
    # tags:                                 # tag-trigger temporarily disabled (see .github/RELEASE.md)
    #   - "markdown-renderer/v*"            # re-enable by removing the leading '#' on both lines
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    permissions:
      contents: read
      packages: write
    with:
      addon-name: markdown-renderer
      addon-display-name: "Markdown Renderer"
      addon-description: "Renders Markdown directories as Docsify SPAs through Home Assistant Ingress"
      archs: '["amd64"]'
    secrets:
      HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
      HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
