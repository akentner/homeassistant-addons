name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        arch:
          - amd64
          - aarch64
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve platform and base image
        id: meta
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "PLATFORM=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "PLATFORM=linux/arm64" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push coding-assistants
        uses: docker/build-push-action@v6
        with:
          context: ./coding-assistants
          platforms: ${{ steps.meta.outputs.PLATFORM }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.BUILD_FROM }}
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_NAME=Coding Assistants
            BUILD_DESCRIPTION=Terminal with Claude Code, OpenCode, and GitHub Copilot CLI
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/akentner/homeassistant-addons/${{ matrix.arch }}-coding_assistants:${{ steps.version.outputs.VERSION }}
            ghcr.io/akentner/homeassistant-addons/${{ matrix.arch }}-coding_assistants:latest

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
