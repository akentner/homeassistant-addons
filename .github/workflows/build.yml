name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        arch:
          - amd64
          - aarch64
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # Tag push: use the tag (strip leading v). workflow_dispatch: read from config.yaml.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(yq eval '.version' coding-assistants/config.yaml)
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify HA — build started
        if: env.HA_BASE_URL != ''
        env:
          HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
          HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
          NOTIFY_DELIVERY_ID: ${{ github.run_id }}-${{ github.run_number }}
          NOTIFY_EVENT: started
          NOTIFY_PAYLOAD: >-
            {
              "event": "started",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "actor": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "trigger": "${{ github.event_name }}",
              "addon": "coding-assistants",
              "version": "${{ steps.version.outputs.VERSION }}",
              "arch": "${{ matrix.arch }}",
              "started_at": "${{ github.event.head_commit.timestamp }}"
            }
        run: ./.github/scripts/notify-ha.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve platform and base image
        id: meta
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "PLATFORM=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "PLATFORM=linux/arm64" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push coding-assistants
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: ./coding-assistants
          platforms: ${{ steps.meta.outputs.PLATFORM }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.BUILD_FROM }}
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_NAME=Coding Assistants
            BUILD_DESCRIPTION=Terminal with Claude Code, OpenCode, and GitHub Copilot CLI
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/akentner/homeassistant-addons/${{ matrix.arch }}-coding_assistants:${{ steps.version.outputs.VERSION }}
            ghcr.io/akentner/homeassistant-addons/${{ matrix.arch }}-coding_assistants:latest

      - name: Notify HA — build finished
        if: always() && env.HA_BASE_URL != ''
        env:
          HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
          HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
          NOTIFY_DELIVERY_ID: ${{ github.run_id }}-${{ github.run_number }}
          NOTIFY_EVENT: finished
          NOTIFY_PAYLOAD: >-
            {
              "event": "finished",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "actor": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "trigger": "${{ github.event_name }}",
              "addon": "coding-assistants",
              "version": "${{ steps.version.outputs.VERSION }}",
              "arch": "${{ matrix.arch }}",
              "conclusion": "${{ job.status }}",
              "image_tag": "ghcr.io/akentner/homeassistant-addons/${{ matrix.arch }}-coding_assistants:${{ steps.version.outputs.VERSION }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        run: ./.github/scripts/notify-ha.sh

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
