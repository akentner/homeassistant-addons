name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Trust boundary: this repository is PUBLIC, so anyone with a GitHub account can
    # post a comment. Matching only the comment body would let a drive-by commenter
    # start a job that has MINIMAX_API_KEY in its environment. author_association is
    # the trust signal carried on the comment payload of both triggers above, so the
    # author clause is required and ANDed with the body clause.
    # CONTRIBUTOR is deliberately NOT trusted: it only means "has had a pull request
    # merged here" -- renovate[bot] already reports CONTRIBUTOR on this repository.
    # The four body alternatives stay parenthesised as one group; without the parens
    # the expression would degrade to "body-a || body-b || (body-c && author)" and the
    # first two alternatives would still fire for an untrusted author.
    if: |
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # No completed run to measure (the job is comment-triggered and has
    # only ever been skipped). An agent run is unbounded by nature, so this
    # is a deliberate ceiling rather than a fitted value.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run opencode
        # Exact-tag pin, a documented exception to the floating-major policy in
        # docs/DEVELOPMENT.md `### Action Pinning`: anomalyco/opencode publishes no
        # major tag (git/ref/tags/v1 -> 404), so @v1 does not exist. A mutable ref
        # would let the upstream owner change what executes with MINIMAX_API_KEY
        # already in this environment. An exact tag is the only immutable, non-SHA
        # option and Renovate's github-actions manager still raises bumps against it.
        uses: anomalyco/opencode/github@v1.18.30
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          model: minimax-coding-plan/MiniMax-M3
