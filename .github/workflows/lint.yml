name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Optimize workflow concurrency
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Observed 37-45s. 15 minutes covers a full pre-commit environment
    # rebuild when the Python/Node caches miss.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install lint dependencies
        run: |
          # Install Python dependencies
          python -m pip install --upgrade pip
          pip install 'pre-commit>=4.6.2' yamllint shellcheck-py

          # Install Node.js dependencies
          npm install -g markdownlint-cli2@0.23.2

      - name: Install actionlint
        env: { GH_TOKEN: "${{ github.token }}" }  # authenticated lookup: the anonymous API is rate limited
        run: |
          ACTIONLINT_VERSION=$(gh api repos/rhysd/actionlint/releases/latest --jq .tag_name)
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/
          actionlint --version

      - name: Install hadolint
        run: |
          HADOLINT_VERSION=$(curl -s https://api.github.com/repos/hadolint/hadolint/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Run pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Lint YAML files
        run: |
          echo "Linting YAML files..."
          find . \( -name "*.yaml" -o -name "*.yml" \) -not -path "./terraform-bridge/*" | grep -v ".git" | xargs yamllint -d relaxed

      - name: Lint GitHub Actions workflows
        run: |
          echo "Linting GitHub Actions workflows..."
          actionlint

      - name: Lint shell scripts
        run: |
          echo "� Running shellcheck on shell scripts..."
          find . -name "*.sh" -type f -not -path "./terraform-bridge/*" -exec shellcheck {} + || \
            echo "No shell scripts to check"

      - name: Lint Markdown files
        run: |
          echo "Linting Markdown files..."
          markdownlint-cli2 "**/*.md"

      - name: Validate Add-on configurations
        run: |
          echo "Validating Add-on configurations..."

          # Check that all add-on directories have required files
          for addon_dir in */; do
            if [[ -f "${addon_dir}config.yaml" ]]; then
              echo "Validating ${addon_dir}..."

              # Check required files exist
              for required_file in "config.yaml" "Dockerfile" "run.sh"; do
                if [[ ! -f "${addon_dir}${required_file}" ]]; then
                  echo "ERROR: ${addon_dir} missing required file: ${required_file}"
                  exit 1
                fi
              done

              # Validate config.yaml structure
              if ! yq eval '.name' "${addon_dir}config.yaml" >/dev/null 2>&1; then
                echo "ERROR: ${addon_dir}config.yaml is invalid or missing 'name' field"
                exit 1
              fi

              # Check if upstream config exists and validate it
              if [[ -f "${addon_dir}.upstream.yaml" ]]; then
                if ! yq eval '.upstream.repository' "${addon_dir}.upstream.yaml" >/dev/null 2>&1; then
                  echo "ERROR: ${addon_dir}.upstream.yaml is invalid or missing 'upstream.repository' field"
                  exit 1
                fi
              fi

              echo "✅ ${addon_dir} validation passed"
            fi
          done

      - name: Check for common issues
        run: |
          echo "Checking for common issues..."

          # Check for tabs in YAML files (should use spaces)
          if grep -r $'\t' --include="*.yaml" --include="*.yml" .; then
            echo "ERROR: Found tabs in YAML files. Use spaces instead."
            exit 1
          fi

          # Check for trailing whitespace
          if find . \( -name "*.yaml" -o -name "*.yml" -o -name "*.md" -o -name "*.sh" \) -print0 | xargs -0 grep -l '[[:space:]]$'; then
            echo "WARNING: Found trailing whitespace in files"
          fi

          # Check for mixed line endings
          if find . \( -name "*.yaml" -o -name "*.yml" -o -name "*.md" -o -name "*.sh" \) -print0 | xargs -0 file | grep -i crlf; then
            echo "ERROR: Found files with Windows line endings (CRLF). Use Unix line endings (LF)."
            exit 1
          fi

          echo "✅ Common issues check passed"

  lint-results:
    needs: [lint, changes, admin-ui, secrets-sync, ntfy, haos-monitor, coding-assistants]
    runs-on: ubuntu-latest
    # Reporting job: echoes a verdict and exits. Seconds, not minutes.
    timeout-minutes: 5
    if: always()
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Report results
        run: |
          # success and skipped (path-filtered out) pass; failure and cancelled fail.
          # marketplace-repo-proxy is deliberately not a need (work in progress, gates nothing).
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [[ -z "$bad" ]]; then
            echo "✅ All lint checks passed!"
          else
            printf '%s\n' "$bad"
            echo "❌ Lint checks failed. Please fix the issues above."
            exit 1
          fi

  # Appended on purpose: zizmor.yml deferrals for this file are line-anchored,
  # so no line above this job may move.
  admin-ui:
    needs: changes
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3' 'jinja2==3.1.6'

      - name: Lib unit tests (node)
        run: node --test admin-ui/tests/js/*.test.mjs

      - name: Server, rule and docs tests (pytest)
        run: python -m pytest admin-ui/tests -q

      - name: Lib copies in sync
        run: make check-admin-ui-sync STRICT=yes
  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  secrets-sync:
    needs: changes
    if: needs.changes.outputs.secrets_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3' 'jinja2==3.1.6'

      - name: Front end tests (node)
        run: node --test secrets-sync/tests/web/js/*.test.mjs

      - name: Add-on tests (pytest)
        working-directory: secrets-sync
        run: python -m pytest -q

      - name: Lib copies in sync and rules
        run: make check-admin-ui-sync check-admin-ui-rules

  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  ntfy:
    needs: changes
    if: needs.changes.outputs.ntfy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: GUI unit tests (node)
        run: node --test ntfy/tests/js/*.test.mjs

      - name: Add-on tests (pytest)
        run: python -m pytest ntfy/tests -q

      - name: Lib copies in sync
        run: make check-admin-ui-sync

      - name: Blueprint rules
        run: make check-admin-ui-rules

  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  marketplace-repo-proxy:
    needs: changes
    if: needs.changes.outputs.marketplace_repo_proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: Add-on tests (pytest)
        run: python -m pytest marketplace-repo-proxy/tests -q

  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  # Decides which test jobs are affected. push to main and workflow_dispatch run everything;
  # a change to this file sets every flag.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin_ui: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.admin_ui == 'true' }}
      secrets_sync: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.secrets_sync == 'true' }}
      ntfy: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.ntfy == 'true' }}
      haos_monitor: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.haos_monitor == 'true' }}
      coding_assistants: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.coding_assistants == 'true' }}
      marketplace_repo_proxy: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.marketplace_repo_proxy == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ) ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            admin_ui:
              - 'admin-ui/**'
              - 'Makefile'
              - 'internal/**'
              - '.github/workflows/lint.yml'
            secrets_sync:
              - 'secrets-sync/**'
              - 'admin-ui/**'
              - 'Makefile'
              - 'internal/**'
              - '.github/workflows/lint.yml'
            ntfy:
              - 'ntfy/**'
              - 'admin-ui/**'
              - 'Makefile'
              - 'internal/**'
              - '.github/workflows/lint.yml'
            haos_monitor:
              - 'haos-monitor/**'
              - 'admin-ui/**'
              - 'Makefile'
              - 'internal/**'
              - '.github/workflows/lint.yml'
            coding_assistants:
              - 'coding-assistants/**'
              - 'admin-ui/**'
              - 'Makefile'
              - 'internal/**'
              - '.github/workflows/lint.yml'
            marketplace_repo_proxy:
              - 'marketplace-repo-proxy/**'
              - '.github/workflows/lint.yml'

  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  haos-monitor:
    needs: changes
    if: needs.changes.outputs.haos_monitor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: Add-on tests (pytest)
        run: python -m pytest haos-monitor/tests -q

  # Appended on purpose, like admin-ui above (line-anchored zizmor deferrals).
  coding-assistants:
    needs: changes
    if: needs.changes.outputs.coding_assistants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: GUI unit tests (node)
        run: node --test coding-assistants/tests/*.test.mjs

      - name: Add-on tests (unittest)
        run: python -m unittest discover -s coding-assistants/tests -p 'test_*.py'

      - name: Lib copies in sync
        run: make check-admin-ui-sync
