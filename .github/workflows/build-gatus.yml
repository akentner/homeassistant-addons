name: Build Gatus

on:
  push:
    branches:
      - main
    paths:
      - "gatus/**"
    # tags:                       # tag-trigger temporarily disabled (see .github/RELEASE.md)
    #   - "gatus/v*"              # re-enable by removing the leading '#' on both lines
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    with:
      addon-name: gatus
      addon-display-name: "Gatus"
      addon-description: "Automated status and uptime monitoring with a beautiful dashboard"
      archs: '["amd64"]'
