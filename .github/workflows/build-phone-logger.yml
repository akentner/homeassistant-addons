name: Build Phone Logger

on:
  push:
    branches:
      - main
    paths:
      - "phone-logger/**"
    # tags:                          # tag-trigger temporarily disabled (see .github/RELEASE.md)
    #   - "phone-logger/v*"           # re-enable by removing the leading '#' on both lines
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    with:
      addon-name: phone-logger
      addon-display-name: "Phone Logger"
      addon-description: "Phone logging and adapter integration for Home Assistant"
      archs: '["amd64"]'
