name: Base Image Update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Both this workflow and .github/workflows/auto-update.yml commit version
# bumps to main and push them, so two overlapping runs give a
# non-fast-forward push - or, worse, a green run that pushed the wrong
# content. The group name is deliberately shared with that workflow
# because a repo-scoped group is what makes the two mutually exclusive;
# it also stops both runs from asking for a build of the same ref.
# cancel-in-progress: false so the second run queues rather than
# aborting either one.
concurrency:
  group: addon-version-bump
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Observed 11-15s across daily runs. No per-add-on network fetches
    # beyond the base-image digest lookups, so a tighter cap than
    # auto-update is appropriate.
    timeout-minutes: 15
    permissions:
      contents: write
      # actions: write is required to create a workflow_dispatch event, which is
      # how this job kicks off the per-add-on image builds its own push cannot
      # trigger (see the NOTE below). No other workflow in this repository has
      # ever requested this scope.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # NOTE: a push made with GITHUB_TOKEN creates NO workflow runs at all (documented
      # GitHub limitation) — not lint.yml, and not build-<addon>.yml, which triggers on
      # `push` to main with `paths: <addon>/**`. So an automated base-image bump used to
      # advertise a new add-on version whose ghcr.io image was never built. The workaround
      # is the dispatch step at the end of the run block below: workflow_dispatch is the
      # documented exception, and a dispatch created with GITHUB_TOKEN does run.
      # See: https://docs.github.com/actions/using-workflows/triggering-a-workflow
      - name: Check and update base images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # Capturing HEAD here is a measurement of what this step starts from.
          # $GITHUB_SHA would be an unverifiable assumption about what
          # actions/checkout left in the work tree. Capture and export are two
          # separate lines because combining them into a single export with a
          # command substitution trips SC2155.
          BASE_SHA=$(git rev-parse HEAD)
          export BASE_SHA

          ERRORS=0
          UPDATES_MADE=0

          # Run per-add-on so one failure doesn't block others
          while IFS= read -r addon; do
            echo "INFO: checking base image for $addon"

            python3 internal/update-base-image.py "$addon" || {
              echo "ERROR: update-base-image.py failed for $addon"
              ERRORS=1
              continue
            }

            if git diff --quiet; then
              echo "INFO: no file changes for $addon"
              continue
            fi

            # Determine new config version for commit message
            new_version=$(grep -m1 '^version:' "$addon/config.yaml" | \
              sed 's/version:[[:space:]]*["\x27]\(.*\)["\x27]/\1/')

            git add "$addon/build.yaml" "$addon/config.yaml" "$addon/README.md"
            git commit -m "chore($addon): bump base image, update to $new_version"
            UPDATES_MADE=1

          done < <(python3 - <<'EOF'
          import yaml, sys
          from pathlib import Path
          cfg = yaml.safe_load(Path("internal/base-image-config.yaml").read_text())
          for name in cfg.get("addons", {}):
              print(name)
          EOF
          )

          # The dispatch position below is load-bearing in both directions: under
          # `set -e` a failed push aborts the step, so nothing is dispatched for
          # commits that never landed; and a dispatch placed before the push would
          # build the pre-bump tree.
          if [ "$UPDATES_MADE" -eq 1 ]; then
            git push
            ./internal/dispatch-builds.sh || ERRORS=1
          fi

          exit $ERRORS
