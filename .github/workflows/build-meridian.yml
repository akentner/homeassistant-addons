name: Build Meridian

on:
  push:
    branches:
      - main
    paths:
      - "meridian/**"
    # tags:                       # tag-trigger temporarily disabled (see .github/RELEASE.md)
    #   - "meridian/v*"           # re-enable by removing the leading '#' on both lines
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    with:
      addon-name: meridian
      addon-display-name: "Meridian Claude Max Proxy"
      addon-description: "Exposes a local Anthropic-compatible API backed by a Claude Max subscription"
      archs: '["amd64"]'
