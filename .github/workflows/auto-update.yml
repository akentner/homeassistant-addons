name: Auto Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Serialize auto-update runs so two of them cannot race for the same
# upstream bump. cancel-in-progress: false means a second run (e.g. a
# daily cron that fires while the previous day's run is still in
# progress, or a manual workflow_dispatch while the schedule is
# running) queues and waits rather than aborting either. Without this,
# the second run reads the same current_version, sees the same
# upstream-newer-version, runs update-version.py, and races the
# first run's git push (which fails with non-fast-forward on the
# second, or - worse - succeeds with the wrong content if both had
# local commits staged). With the new <addon>/v<version> tag schema
# the tag-collision risk is gone, but the git-push race remains, so
# the serialization still pays for itself.
# The group name is shared with .github/workflows/base-image-update.yml
# (cron 07:00 UTC), which commits and pushes version bumps to main the
# same way. Until it joined this group it had no concurrency block at
# all, so an overlap reproduced exactly the race described above, only
# across two workflows instead of within one. One repo-scoped group
# makes the two mutually exclusive and also stops both runs from asking
# for a build of the same ref. The crons are an hour apart and this
# workflow is observed at 8-28s, so the queueing cost is negligible.
# History note: this workflow now passes --no-tag and creates no tag at
# all, so the <addon>/v<version> tag-collision sentence above records
# the old behaviour rather than a live claim - see the call-site comment
# in the per-add-on loop below for why.
concurrency:
  group: addon-version-bump
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Observed 8-28s across daily runs. 20 minutes covers a cold start plus
    # one gh-API call and one `npx prettier` fetch per add-on; anything
    # beyond that means a hung network call, not slow work.
    timeout-minutes: 20
    permissions:
      contents: write
      # actions: write is required to create a workflow_dispatch event, which is
      # how this job kicks off the per-add-on image builds its own push cannot
      # trigger (see the NOTE below). base-image-update.yml requests the same
      # scope for the same reason; no other workflow in this repository does.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # NOTE: a push made with GITHUB_TOKEN creates NO workflow runs at all (documented
      # GitHub limitation) — not lint.yml, and not build-<addon>.yml, which triggers on
      # `push` to main with `paths: <addon>/**`. So an automated version bump used to
      # advertise a new add-on version whose ghcr.io image was never built. The workaround
      # is the dispatch step at the end of the run block below: workflow_dispatch is the
      # documented exception, and a dispatch created with GITHUB_TOKEN does run.
      # See: https://docs.github.com/actions/using-workflows/triggering-a-workflow
      - name: Check and update add-ons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # Capturing HEAD here is a measurement of what this step starts from.
          # $GITHUB_SHA would be an unverifiable assumption about what
          # actions/checkout left in the work tree. Capture and export are two
          # separate lines because combining them into a single export with a
          # command substitution trips SC2155.
          BASE_SHA=$(git rev-parse HEAD)
          export BASE_SHA

          ERRORS=0
          UPDATES_MADE=0

          while IFS= read -r upstream_file; do
            addon_dir=$(dirname "$upstream_file")
            addon_name=$(basename "$addon_dir")

            echo "INFO: checking $addon_name"

            # Parse .upstream.yaml with yq (pre-installed on ubuntu-latest 4.52.4)
            upstream_repo=$(yq eval '.upstream.repository' "$upstream_file")
            version_strip=$(yq eval '.upstream.version_strip' "$upstream_file")

            # Get latest upstream release tag via gh CLI (AUTO-01)
            latest_tag=$(gh release view --repo "$upstream_repo" --json tagName --jq .tagName 2>/dev/null) || {
              echo "ERROR: could not fetch release for $upstream_repo"
              ERRORS=1
              continue
            }

            # Strip version prefix using version_strip as a sed regex (e.g. "^v" -> sed 's|^v||')
            # Use "|" as delimiter so that slashes in version_strip (e.g. "^version/") don't break sed
            # shellcheck disable=SC2001
            latest_version=$(echo "$latest_tag" | sed "s|${version_strip}||")

            # Read current version from build.yaml (plain X.Y.Z, no subpatch)
            current_version=$(yq eval '.args.VERSION' "$addon_dir/build.yaml")

            if [ "$latest_version" = "$current_version" ]; then
              echo "INFO: $addon_name already at $current_version, skipping"
              continue
            fi

            echo "INFO: $addon_name needs update $current_version -> $latest_version"

            # Update the 3-file version set (AUTO-02)
            # Do NOT pass --check-release (that flag is interactive and will hang the workflow)
            # --no-tag: this call runs BEFORE the git commit further down the loop, so
            # HEAD here is still the pre-bump commit and tagging it names the wrong
            # commit. Measured: meridian/v1.68.0-0 points at 9f45b96, whose
            # meridian/build.yaml still reads VERSION 1.66.0 - an older version.
            # Releases are tagged out of band; see .github/RELEASE.md. Rejected:
            # git push --follow-tags, because actions/checkout fetches no tags.
            python3 internal/update-version.py "$addon_name" "$latest_version" --no-tag || {
              echo "ERROR: update-version.py failed for $addon_name"
              ERRORS=1
              continue
            }

            # Detect actual file changes (AUTO-04) — script exits 0 for both updated AND no-op
            if git diff --quiet; then
              echo "INFO: no file changes after update-version.py for $addon_name"
              continue
            fi

            # Fetch upstream release notes and prepend to CHANGELOG.md
            release_body=$(gh release view --repo "$upstream_repo" \
              --json body --jq .body 2>/dev/null || true)
            if [[ -n "$release_body" ]]; then
              changelog="$addon_dir/CHANGELOG.md"
              tmp=$(mktemp)
              if [[ -f "$changelog" ]]; then
                { printf '%s\n\n' "$release_body"; cat "$changelog"; } > "$tmp"
              else
                printf '%s\n' "$release_body" > "$tmp"
              fi
              mv "$tmp" "$changelog"
              # Format with prettier so lint.yml does not reject the commit
              npx --yes prettier@3.9.6 --write "$changelog"
              git add "$changelog"
            fi

            # Stage only the three known version files (never git add -A)
            git add "$addon_dir/config.yaml" "$addon_dir/build.yaml" "$addon_dir/README.md"
            git commit -m "chore($addon_name): update to $latest_version"
            UPDATES_MADE=1

          done < <(find . -maxdepth 2 -name .upstream.yaml | sort)

          # Push once at the end — only if commits were made (AUTO-03)
          #
          # The dispatch position below is load-bearing in both directions: under
          # `set -e` a failed push aborts the step, so nothing is dispatched for
          # commits that never landed; and a dispatch placed before the push would
          # build the pre-bump tree.
          if [ "$UPDATES_MADE" -eq 1 ]; then
            git push
            ./internal/dispatch-builds.sh || ERRORS=1
          fi

          # Exit non-zero if any per-addon error occurred (D-04)
          exit $ERRORS
