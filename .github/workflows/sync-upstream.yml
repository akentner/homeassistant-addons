name: Sync upstream releases

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon directory to sync'
        required: true
        default: 'phone-logger'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync ${{ github.event.client_payload.addon || inputs.addon }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set addon path
        id: addon
        run: |
          ADDON="${{ github.event.client_payload.addon || inputs.addon }}"
          echo "path=${ADDON}" >> $GITHUB_OUTPUT
          echo "upstream_file=${ADDON}/.upstream.yaml" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve upstream version
        id: sync
        run: |
          ADDON_PATH="${{ steps.addon.outputs.path }}"
          UPSTREAM_FILE="${{ steps.addon.outputs.upstream_file }}"

          if [[ ! -f "$UPSTREAM_FILE" ]]; then
            echo "::error::Upstream config not found: $UPSTREAM_FILE"
            exit 1
          fi

          UPSTREAM_REPO=$(yq '.upstream.repository' "$UPSTREAM_FILE")
          echo "Upstream repository: $UPSTREAM_REPO"

          LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')
          RELEASE_VERSION=${LATEST_TAG#v}
          echo "Latest upstream version: $RELEASE_VERSION"

          CURRENT_VERSION=$(yq '.version' "$ADDON_PATH/config.yaml")
          echo "Current addon version: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]]; then
            echo "Already up to date"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update available: $CURRENT_VERSION -> $RELEASE_VERSION"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "new_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            echo "release_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "upstream_repo=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update addon version
        if: steps.sync.outputs.needs_update == 'true'
        run: |
          ADDON_PATH="${{ steps.addon.outputs.path }}"
          NEW_VERSION="${{ steps.sync.outputs.new_version }}"

          # Update config.yaml (addon version shown in HA UI)
          yq -i ".version = \"$NEW_VERSION\"" "$ADDON_PATH/config.yaml"
          echo "Updated $ADDON_PATH/config.yaml"

          # Update build.yaml (VERSION arg used by Dockerfile to download source)
          if [[ -f "$ADDON_PATH/build.yaml" ]]; then
            yq -i ".args.VERSION = \"$NEW_VERSION\"" "$ADDON_PATH/build.yaml"
            echo "Updated $ADDON_PATH/build.yaml"
          fi

      - name: Commit directly to main
        if: steps.sync.outputs.needs_update == 'true'
        id: commit
        run: |
          ADDON_PATH="${{ steps.addon.outputs.path }}"
          NEW_VERSION="${{ steps.sync.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ADDON_PATH/config.yaml" "$ADDON_PATH/build.yaml"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore($ADDON_PATH): sync upstream to $NEW_VERSION"

          if git push origin main; then
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "Pushed directly to main"
          else
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "::warning::Push to main failed (conflict?), falling back to PR"
          fi

      - name: Fallback to Pull Request
        if: steps.sync.outputs.needs_update == 'true' && steps.commit.outputs.committed == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore(${{ steps.addon.outputs.path }}): sync upstream to ${{ steps.sync.outputs.new_version }}"
          title: "chore(${{ steps.addon.outputs.path }}): sync upstream to ${{ steps.sync.outputs.new_version }}"
          body: |
            Automatic upstream sync failed to push directly (likely a conflict).

            **Addon:** `${{ steps.addon.outputs.path }}`
            **New version:** `${{ steps.sync.outputs.new_version }}`
            **Release:** https://github.com/${{ steps.sync.outputs.upstream_repo }}/releases/tag/${{ steps.sync.outputs.release_tag }}
          branch: "sync/${{ steps.addon.outputs.path }}-${{ steps.sync.outputs.new_version }}"
          delete-branch: true
