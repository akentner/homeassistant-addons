name: Build network-tools

on:
    push:
        branches:
            - main
        paths:
            - "network-tools/**"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract version and metadata
              id: meta
              run: |
                  VERSION=$(yq eval '.version' network-tools/config.yaml)
                  BUILD_FROM=$(yq eval '.build_from.amd64' network-tools/build.yaml)
                  BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
                  {
                    echo "VERSION=$VERSION"
                    echo "BUILD_FROM=$BUILD_FROM"
                    echo "BUILD_DATE=$BUILD_DATE"
                  } >> "$GITHUB_OUTPUT"

            - name: Build and push network-tools
              uses: docker/build-push-action@v6
              with:
                  context: ./network-tools
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BUILD_FROM=${{ steps.meta.outputs.BUILD_FROM }}
                      VERSION=${{ steps.meta.outputs.VERSION }}
                      BUILD_ARCH=amd64
                      BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
                      BUILD_NAME=Network Tools
                      BUILD_DESCRIPTION=Network diagnostics and host detection for Home Assistant
                      BUILD_REF=${{ github.sha }}
                      BUILD_REPOSITORY=${{ github.repository }}
                      BUILD_VERSION=${{ steps.meta.outputs.VERSION }}
                  tags: |
                      ghcr.io/akentner/homeassistant-addons/amd64-network_tools:${{ steps.meta.outputs.VERSION }}
                      ghcr.io/akentner/homeassistant-addons/amd64-network_tools:latest
