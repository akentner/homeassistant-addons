name: Build Network Tools

on:
  push:
    branches:
      - main
    paths:
      - "network-tools/**"
    tags:
      - "network-tools/v*"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    with:
      addon-name: network-tools
      addon-display-name: "Network Tools"
      addon-description: "Network diagnostics and ARP-based host detection for Home Assistant"
      archs: '["amd64"]'
