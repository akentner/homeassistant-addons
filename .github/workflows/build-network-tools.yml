name: Build Network Tools

on:
  push:
    branches:
      - main
    paths:
      - "network-tools/**"
    tags:
      - "network-tools/v*"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    permissions:
      contents: read
      packages: write
    with:
      addon-name: network-tools
      addon-display-name: "Network Tools"
      addon-description: "Network diagnostics and ARP-based host detection for Home Assistant"
      archs: '["amd64"]'
    secrets:
      HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
      HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
