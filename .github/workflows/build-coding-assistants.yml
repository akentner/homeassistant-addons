name: Build Coding Assistants

on:
  push:
    branches:
      - main
    paths:
      - "coding-assistants/**"
    # tags:                                       # tag-trigger temporarily disabled (see .github/RELEASE.md)
    #   - "coding-assistants/v*"                  # re-enable by removing the leading '#' on both lines
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-template.yml
    permissions:
      contents: read
      packages: write
    with:
      addon-name: coding-assistants
      addon-display-name: "Coding Assistants"
      addon-description: "Terminal with Claude Code, OpenCode, and GitHub Copilot CLI"
      archs: '["amd64", "aarch64"]'
    secrets:
      HA_BASE_URL: ${{ secrets.HA_BASE_URL }}
      HA_WEBHOOK_ID: ${{ secrets.HA_WEBHOOK_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
