name: "LiteLLM"
description: "OpenAI-compatible API gateway with bundled PostgreSQL — virtual keys, spend tracking, model routing."
version: "1.101.0-10"
slug: "litellm"
init: false
arch:
  - amd64
url: "https://github.com/akentner/homeassistant-addons"
startup: "application"
boot: "auto"
host_network: false
ingress: true
ingress_port: 4000
image: "ghcr.io/akentner/homeassistant-addons/{arch}-litellm"
icon: true
ports:
  4000/tcp: 4000
ports_description:
  4000/tcp: "OpenAI-compatible API (HTTP) — direct port for LAN/Tailscale clients"
map:
  - type: addon_config
    read_only: false
    path: /addon_config
  - type: backup
    read_only: false
panel_icon: "mdi:brain"
panel_title: "LiteLLM"
health_check:
  endpoint: "http://localhost:4000/health/liveliness"
  interval: 30
  timeout: 5

options:
  log_level: "info"
  master_key: ""
  salt_key: ""
  ingress_origin: ""
  env:
    litellm: []
    postgres: []
    valkey: []
  postgres:
    shared_buffers: "64MB"
    max_connections: 20
    log_min_duration_statement: 1000

schema:
  log_level: "list(debug|info|warning|error)?"
  master_key: "password?"
  salt_key: "password?"
  ingress_origin: "str?"
  env:
    litellm:
      - name: "match(^[A-Z][A-Z0-9_]*$)"
        value: "str"
    postgres:
      - name: "match(^[A-Z][A-Z0-9_]*$)"
        value: "str"
    valkey:
      - name: "match(^[A-Z][A-Z0-9_]*$)"
        value: "str"
  postgres:
    shared_buffers: "str?"
    max_connections: "int(5,200)?"
    log_min_duration_statement: "int(0,60000)?"
