configuration:
  providers:
    name: Providers
    description: Enabled secret sources in priority order (bitwarden, sops). The order decides the winner when the
      collision policy is 'priority'.
  interval:
    name: Interval (seconds)
    description: Time between sync cycles (60 to 86400).
  check_interval:
    name: Change check interval (seconds)
    description: How often a cheap check (git ls-remote) looks for changes in the SOPS git repository. A change
      triggers a sync right away, the regular interval stays as fallback. 0 disables the check; 1 to 29 is raised
      to 30.
  collision_policy:
    name: Collision policy
    description: '''error'' writes nothing when a key exists in two sources; ''priority'' lets the earlier provider
      win.'
  shrink_guard_percent:
    name: Shrink guard (%)
    description: Refuse to write when the number of items drops by more than this share compared with the last write.
  log_level:
    name: Log level
    description: Verbosity of the add-on log. Secret values are never logged, at any level.
  usage_scan:
    name: Secret usage scan
    description: Show where '!secret' keys are used. 'config' scans the Home Assistant config, 'all' also reads
      the configs of other add-ons (read-only). Only key names and file positions are stored, never values.
  bitwarden:
    name: Bitwarden
    description: Settings of the Bitwarden provider.
    fields:
      server_url:
        name: Server URL
        description: Bitwarden or Vaultwarden server URL.
      client_id:
        name: API client ID
        description: Personal API key client_id (user.xxxx). Passed to bw via environment only.
      client_secret:
        name: API client secret
        description: Personal API key client_secret. Passed to bw via environment only.
      master_password:
        name: Master password
        description: Needed to unlock the vault. Passed to bw via environment only.
      organization_id:
        name: Organization ID
        description: Optional. Restrict the sync to items of this organization.
      collection_id:
        name: Collection ID
        description: Optional. Restrict the sync to this collection.
      key_style:
        name: Key style
        description: Naming scheme of the generated secret keys. 'legacy' is the only style so far.
      notes_dir:
        name: Notes directory
        description: Secure notes are written as files below this directory inside the secrets files directory.
  sops:
    name: SOPS
    description: Settings of the SOPS provider.
    fields:
      source:
        name: Source
        description: 'Where the encrypted file comes from: ''file'' (local path) or ''git'' (repository).'
      file:
        name: SOPS file
        description: Path of the SOPS-encrypted YAML file. The age key must be at /addon_config/age.key (mode 600).
      flatten_separator:
        name: Flatten separator
        description: Joins nested keys, e.g. 'db' + 'password' becomes db_password.
      git_url:
        name: Git URL
        description: Repository URL, ssh (git@host:org/repo.git, ssh://...) or https://. No credentials inside the
          URL. Used when source is git.
      git_branch:
        name: Git branch
        description: Branch to read.
      git_path:
        name: Path in repository
        description: Path of the SOPS-encrypted file inside the repository.
      git_username:
        name: Git username (https)
        description: User name for https token login, e.g. x-access-token (GitHub) or oauth2 (GitLab). Not used
          for ssh.
      git_token:
        name: Git token (https)
        description: Access token with read access (e.g. fine-grained PAT with contents:read). Passed via environment
          only. Leave empty for public repositories or ssh.
