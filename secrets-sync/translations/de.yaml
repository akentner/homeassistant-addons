configuration:
  providers:
    name: Provider
    description: Aktive Secret-Quellen in Prioritätsreihenfolge (bitwarden, sops). Die Reihenfolge entscheidet bei
      Kollisionen mit Policy 'priority'.
  interval:
    name: Intervall (Sekunden)
    description: Zeit zwischen Sync-Zyklen (60 bis 86400).
  check_interval:
    name: Änderungsprüfung (Sekunden)
    description: Wie oft eine günstige Prüfung (git ls-remote) das SOPS-Git-Repository auf Änderungen abfragt. Eine
      Änderung löst sofort einen Sync aus, das normale Intervall bleibt als Rückfall. 0 schaltet die Prüfung ab;
      1 bis 29 wird auf 30 angehoben.
  collision_policy:
    name: Kollisions-Policy
    description: '''error'' schreibt nichts, wenn ein Schlüssel in zwei Quellen vorkommt; ''priority'' lässt den
      früheren Provider gewinnen.'
  shrink_guard_percent:
    name: Schrumpf-Schutz (%)
    description: Nicht schreiben, wenn die Anzahl der Einträge gegenüber dem letzten Schreiben um mehr als diesen
      Anteil sinkt.
  log_level:
    name: Log-Level
    description: Ausführlichkeit des Add-on-Logs. Secret-Werte werden auf keiner Stufe geloggt.
  usage_scan:
    name: Secret-Verwendungs-Scan
    description: Zeigt, wo '!secret'-Schlüssel verwendet werden. 'config' durchsucht die Home-Assistant-Konfiguration,
      'all' liest zusätzlich die Konfigurationen anderer Add-ons (nur lesend). Gespeichert werden nur Schlüsselnamen
      und Dateipositionen, nie Werte.
  bitwarden:
    name: Bitwarden
    description: Einstellungen des Bitwarden-Providers.
    fields:
      server_url:
        name: Server-URL
        description: URL des Bitwarden- oder Vaultwarden-Servers.
      client_id:
        name: API Client-ID
        description: client_id des persönlichen API-Schlüssels (user.xxxx). Wird nur per Umgebungsvariable an bw
          übergeben.
      client_secret:
        name: API Client-Secret
        description: client_secret des persönlichen API-Schlüssels. Wird nur per Umgebungsvariable an bw übergeben.
      master_password:
        name: Master-Passwort
        description: Zum Entsperren des Tresors. Wird nur per Umgebungsvariable an bw übergeben.
      organization_id:
        name: Organisations-ID
        description: Optional. Sync auf Einträge dieser Organisation beschränken.
      collection_id:
        name: Collection-ID
        description: Optional. Sync auf diese Collection beschränken.
      key_style:
        name: Schlüsselstil
        description: Namensschema der erzeugten Secret-Schlüssel. Bisher gibt es nur 'legacy'.
      notes_dir:
        name: Notiz-Verzeichnis
        description: Secure Notes werden als Dateien unter diesem Verzeichnis im Secret-Dateiverzeichnis abgelegt.
  sops:
    name: SOPS
    description: Einstellungen des SOPS-Providers.
    fields:
      source:
        name: Quelle
        description: 'Woher die verschlüsselte Datei kommt: ''file'' (lokaler Pfad) oder ''git'' (Repository).'
      file:
        name: SOPS-Datei
        description: Pfad der SOPS-verschlüsselten YAML-Datei. Der age-Schlüssel muss unter /addon_config/age.key
          liegen (Modus 600).
      flatten_separator:
        name: Trennzeichen
        description: Verbindet verschachtelte Schlüssel, z. B. 'db' + 'password' ergibt db_password.
      git_url:
        name: Git-URL
        description: Repository-URL, ssh (git@host:org/repo.git, ssh://...) oder https://. Keine Zugangsdaten in
          der URL. Wird bei Quelle git verwendet.
      git_branch:
        name: Git-Branch
        description: Zu lesender Branch.
      git_path:
        name: Pfad im Repository
        description: Pfad der SOPS-verschlüsselten Datei im Repository.
      git_username:
        name: Git-Benutzer (https)
        description: Benutzername für den https-Token-Login, z. B. x-access-token (GitHub) oder oauth2 (GitLab).
          Nicht für ssh.
      git_token:
        name: Git-Token (https)
        description: Zugriffstoken mit Leserecht (z. B. Fine-grained PAT mit contents:read). Nur per Umgebungsvariable
          übergeben. Leer lassen bei öffentlichen Repositories oder ssh.
